<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NexDrive — Offline</title>
<meta name="theme-color" content="#0A0A0F">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #0A0A0F; color: #F7F7F9;
    font-family: 'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px;
    text-align: center;
  }
  .card { max-width: 360px; }
  .mark {
    width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 20px;
    background: linear-gradient(135deg, #7C3AED, #6D28D9);
    display: grid; place-items: center; font-weight: 800; font-size: 28px; color: #fff;
  }
  h1 { font-size: 22px; margin: 0 0 8px; font-weight: 700; }
  p { margin: 0 0 22px; color: #9A9AAA; line-height: 1.5; font-size: 15px; }
  button {
    appearance: none; border: 0; cursor: pointer; font: inherit; font-weight: 700;
    color: #fff; background: #7C3AED; border-radius: 12px; padding: 12px 22px;
  }
  button:hover { background: #6D28D9; }
</style>
</head>
<body>
  <main class="card">
    <div class="mark">ND</div>
    <h1>You're offline</h1>
    <p>NexDrive can't reach the network right now. Reconnect and try again — your installed app keeps working for screens you've already opened.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
